[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevpilot"
version = "0.1.0"
description = "A domain-agnostic agentic orchestration framework for scientific, engineering, and research workflows (experimental; no API stability)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]
# Real model providers are optional; the core, RuleRouter and all fakes need none of them.
anthropic = ["anthropic>=1.8,<2"]
jev = ["typesafe-sdk>=0.7.1,<0.8"]
# Optional LLM communication layer: langchain-core + one provider package only
# (no `langchain` meta-package, no LangGraph). LangChain never routes.
langchain = ["langchain-core>=1.0,<2", "langchain-anthropic>=1.0,<2"]
# Only needed to re-extract source PDFs (python -m domains.uav_materials.ingest.build --from-pdf)
data = ["pypdf>=6"]

# Domains are discovered through entry points; the core never imports them.
[project.entry-points."jevpilot.domains"]
arithmetic = "domains.demo:ArithmeticDomain"
stats = "domains.stats_demo:StatsDomain"
uav_materials = "domains.uav_materials:UAVMaterialsDomain"

# One command for the end-to-end applications (the core itself ships no CLI).
[project.scripts]
jevpilot = "apps.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jevpilot", "domains", "integrations", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real-service tests are opt-in: `pytest -m live_jev` (they skip without TYPESAFE_API_KEY).
addopts = "-q -m 'not live_jev'"
markers = ["live_jev: calls the real TypeSafe Jev API (needs TYPESAFE_API_KEY; costs money)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
