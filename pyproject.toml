[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevpilot"
version = "0.0.1"
description = "A domain-agnostic agentic orchestration framework for scientific, engineering, and research workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]
# Real model providers are optional; the core, RuleRouter and all fakes need none of them.
anthropic = ["anthropic>=0.40"]

# Domains are discovered through entry points; the core never imports them.
[project.entry-points."jevpilot.domains"]
arithmetic = "domains.demo:ArithmeticDomain"
stats = "domains.stats_demo:StatsDomain"

[tool.hatch.build.targets.wheel]
packages = ["jevpilot", "domains", "integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
